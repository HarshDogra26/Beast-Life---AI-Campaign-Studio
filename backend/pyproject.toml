[project]
name = "campaign-studio"
version = "1.0.0"
description = "AI Campaign Creative Studio — research agent to coordinated ad creative"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "sqlalchemy>=2.0.48",
    "aiosqlite>=0.20",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.0.2",
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=2.13",
    "mcp>=1.26",
    "pillow>=12.0",
    "tenacity>=9.1",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-mock>=3.15",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Listed explicitly: this directory has several top-level packages, and
# setuptools' auto-discovery refuses to guess between them.
packages = [
    "app",
    "app.api",
    "app.domain",
    "app.graph",
    "app.graph.nodes",
    "app.prompts",
    "app.providers",
    "app.rendering",
    "app.security",
    "app.storage",
    "app.worker",
    "mcp_servers",
]

[tool.setuptools.package-data]
# Prompts and the pricing table are read at runtime, so they must ship.
"app.prompts" = ["*.md"]
"app.providers" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
